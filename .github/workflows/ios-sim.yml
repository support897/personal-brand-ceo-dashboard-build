name: iOS Simulator Copy (NeedsMe)

# Manual run only. Builds an UNSIGNED simulator copy of the SAME tree the
# device workflow ships (the certified tree from support897/needsme, copied
# verbatim into dist/ with the entry promoted exactly as the device
# workflow does), boots a simulator on the runner, installs + cold-launches
# the copy, and captures a first-open screenshot. Test lane only: proves
# nothing about the real phone door; the device build + ios-ipa.yml are
# untouched by this file.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch the certified tree and promote the entry (device workflow's own steps)
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/support897/needsme/tar.gz/refs/heads/main -o "$RUNNER_TEMP/certified.tgz"
          mkdir -p "$RUNNER_TEMP/certified-tree"
          tar -xzf "$RUNNER_TEMP/certified.tgz" -C "$RUNNER_TEMP/certified-tree" --strip-components=1
          rm -rf dist
          cp -r "$RUNNER_TEMP/certified-tree" dist
          cp dist/app/index.html dist/index.html
          sed -i '' -E 's#(src|href)="\.\./#\1="./#g' dist/index.html
          grep -E 'src="\./assets/main-[^"]+\.js"' dist/index.html
          if grep -q "Works right in your browser" dist/index.html; then echo "::error::Wrapped entry is still the landing page"; exit 1; fi
          ls dist/assets/main-*.js
          md5 -r dist/assets/main-*.js

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Build the simulator copy (no signing)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/sim-build" \
            CODE_SIGNING_ALLOWED=NO
          find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "*.app" -print

      - name: Boot a simulator, install, cold-launch, screenshot
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/sim-build/Build/Products" -maxdepth 2 -name "App.app" | head -1)
          echo "App: $APP_PATH"
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j", "devices", "available"]))
          best = None
          for runtime, devs in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      ver = runtime.rsplit("-", 1)[-1]
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"], d["name"])
          print(best[1])
          PY
          )
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted shop.ilseplacencia.needsme
          sleep 8
          xcrun simctl io booted screenshot "$RUNNER_TEMP/needsme-first-open.png"
          ls -la "$RUNNER_TEMP/needsme-first-open.png"
          cd "$RUNNER_TEMP/sim-build/Build/Products/Release-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$RUNNER_TEMP/needsme-sim-app.zip"
          ls -la "$RUNNER_TEMP/needsme-sim-app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: needsme-sim-copy
          path: |
            ${{ runner.temp }}/needsme-sim-app.zip
            ${{ runner.temp }}/needsme-first-open.png
          if-no-files-found: error
          retention-days: 30
