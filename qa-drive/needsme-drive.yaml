          text: "Join Needs Me"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      text: "Explore the demo"
    timeout: 90000
# ---------- first entry: the mascot tour, WHEN IT STANDS ----------
# Drive 5's evidence (the account created by drive 4, whose
# creating session died at the load line): a later sign-in lands
# on the HOME with the guide still unfinished on the record
# (guide step 0, finished false, REST-read at QA) — the tour
# stands on the CREATING entry, not on returns. So the tour
# sequence runs only when its name ask stands at entry; a
# returning account proceeds unnamed, its identity proven at
# REST from QA's chair and its journey carried by the project
# and task titles. When the tour stands: typing the sentinel
# and tapping Next saves it to the profile before the tour
# advances (the shipped Vr()/ko() path); seven stops stand in
# shipped order: name -> menu -> home -> tasks -> calendar ->
# updates -> account; the button reads "Next →" on the first
# six and "Done ✓" on the last.
- runFlow:
    when:
      visible:
        text: "Hi! I'm Pip. Welcome in! What's your name?"
    commands:
      - tapOn:
          text: "Your name"
          waitUntilVisible: true
      - inputText: "Sim Driver NM"
      - tapOn:
          point: "90%, 59%"  # accessory Done, measured on this door (drive 3)
      - takeScreenshot: 03-tour-name
      - tapOn:
          text: "Next →"
          waitUntilVisible: true
      - tapOn:
          text: "Next →"
          waitUntilVisible: true
      - tapOn:
          text: "Next →"
          waitUntilVisible: true
      - tapOn:
