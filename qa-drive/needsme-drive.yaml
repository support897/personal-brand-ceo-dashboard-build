# ---------- cold open: the door stands alone (purity) -------------
# A pristine signed-out boot stands on the v4 door: the mark, the
# icon-only provider pair, the email step, and the demo line at the
# foot (the b13 verdict's DOOR PURITY walk). The demo line is the
# door's own standing marker in both steps — the b12 walk's
# door-return read used the same line.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Explore the demo"
    timeout: 90000
- takeScreenshot: 00-door
# ---------- stage (i): sign up, account 1 (email step, then -------
# ---------- password step; the one button does both) --------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: "${TEST_EMAIL}"
- extendedWaitUntil:
    visible:
      text: "${TEST_EMAIL}"
    timeout: 15000
- takeScreenshot: 01-email-step
- tapOn:
    text: "Next"
    waitUntilVisible: true
- extendedWaitUntil:
    visible:
      text: "Your password"
    timeout: 60000
- tapOn:
    text: "Password"
    waitUntilVisible: true
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 59%"  # accessory Done, CENTRE MEASURED on drive 3 (bar overlays Join; v3s 62% missed the tick by ~26pt and the bar ate the submit)
- takeScreenshot: 02-password-step
- tapOn:
    text: "Join Needs Me"
    waitUntilVisible: true
    retryTapIfNoChange: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Your account could not load. Try again."
    commands:
      - tapOn:
          text: "Join Needs Me"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
